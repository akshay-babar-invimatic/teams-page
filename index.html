<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teams Tab - OAuth</title>

    <script src="https://res.cdn.office.net/teams-js/2.45.0/js/MicrosoftTeams.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #111827;
        }

        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            box-sizing: border-box;
            width: 100%;
            padding: 24px;
        }

        h2 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        p {
            color: #6b7280;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            border: 1px solid #9ca3af;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            margin-top: 16px;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            background: #5b5fc7;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .error {
            color: #b91c1c;
        }

        .success {
            color: #15803d;
        }

        .hidden {
            display: none;
        }

        #contentFrame {
            display: none;
            width: 100%;
            height: 80vh;
            border: none;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="card">

        <!-- Tab configuration -->
        <section id="configureView" class="hidden">
            <h2>Configure Website Tab</h2>
            <p>Enter the URL to display after successful authentication.</p>

            <form id="configForm">
                <label for="contentUrl">Content URL</label>
                <input
                    id="contentUrl"
                    type="url"
                    placeholder="https://example.com"
                    autocomplete="url"
                    required
                />
                <p id="configError" class="error"></p>
            </form>
        </section>

        <!-- Normal tab content -->
        <section id="contentView" class="hidden">
            <h2 id="authStatus">Authenticating...</h2>
            <p id="authMessage">Please wait while we verify your identity.</p>

            <iframe
                id="contentFrame"
                title="Configured website"
            ></iframe>
        </section>

        <!-- Opened outside Teams -->
        <section id="browserView" class="hidden">
            <h2>Teams Tab</h2>
            <p>Open this page inside Microsoft Teams.</p>
        </section>

    </div>
</div>

<script>
(async function () {
    const configureView = document.getElementById("configureView");
    const contentView = document.getElementById("contentView");
    const browserView = document.getElementById("browserView");

    const contentUrlInput = document.getElementById("contentUrl");
    const configError = document.getElementById("configError");

    const authStatus = document.getElementById("authStatus");
    const authMessage = document.getElementById("authMessage");
    const contentFrame = document.getElementById("contentFrame");

    // Keycloak endpoints supplied for testing.
    const authorizeUrl =
        "https://newu-d01.build.ifsdemoworld.com/auth/realms/newud011/protocol/openid-connect/auth";

    const tokenUrl =
        "https://auth/realms/newud011/protocol/openid-connect/token";

    const clientId = "YOUR_CLIENT_ID";

    // Must match the redirect URI registered in Keycloak.
    const redirectUri =
        window.location.origin + window.location.pathname;

    function showView(view) {
        configureView.classList.add("hidden");
        contentView.classList.add("hidden");
        browserView.classList.add("hidden");
        view.classList.remove("hidden");
    }

    function setAuthStatus(message, success = false) {
        authStatus.textContent = message;
        authStatus.className = success ? "success" : "error";
    }

    function randomString() {
        const bytes = crypto.getRandomValues(new Uint8Array(32));

        return Array.from(bytes)
            .map(byte => byte.toString(16).padStart(2, "0"))
            .join("");
    }

    async function createCodeChallenge(verifier) {
        const digest = await crypto.subtle.digest(
            "SHA-256",
            new TextEncoder().encode(verifier)
        );

        return btoa(
            String.fromCharCode(...new Uint8Array(digest))
        )
            .replace(/\+/g, "-")
            .replace(/\//g, "_")
            .replace(/=+$/, "");
    }

    function getConfiguredContentUrl(context) {
        /*
         * Teams does not expose the saved contentUrl directly through
         * getContext(). setConfig() saves the tab configuration, but this
         * page needs a reliable way to retrieve it when the tab opens.
         *
         * For this test, read it from the contentUrl query parameter.
         * Your tab setup must supply this parameter on the content URL.
         */
        const params = new URLSearchParams(window.location.search);
        return params.get("contentUrl");
    }

    async function authenticateWithKeycloak() {
        const params = new URLSearchParams(window.location.search);

        // Handle an OAuth error returned by Keycloak.
        const oauthError = params.get("error");

        if (oauthError) {
            throw new Error(
                params.get("error_description") || oauthError
            );
        }

        const code = params.get("code");

        // If there is no authorization code, start the login flow.
        if (!code) {
            const state = randomString();
            const verifier = randomString();
            const challenge = await createCodeChallenge(verifier);

            sessionStorage.setItem("oauth_state", state);
            sessionStorage.setItem("code_verifier", verifier);

            const query = new URLSearchParams({
                client_id: clientId,
                response_type: "code",
                redirect_uri: redirectUri,
                scope: "openid",
                state: state,
                code_challenge: challenge,
                code_challenge_method: "S256"
            });

            window.location.assign(
                authorizeUrl + "?" + query.toString()
            );

            // Navigation will leave this page. Do not render the iframe.
            return null;
        }

        // Validate the OAuth state before exchanging the code.
        const returnedState = params.get("state");
        const savedState = sessionStorage.getItem("oauth_state");
        const verifier = sessionStorage.getItem("code_verifier");

        if (!savedState || returnedState !== savedState) {
            throw new Error("OAuth state validation failed.");
        }

        if (!verifier) {
            throw new Error("PKCE verifier is missing. Please retry.");
        }

        // Exchange the authorization code for an access token.
        const response = await fetch(tokenUrl, {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: new URLSearchParams({
                grant_type: "authorization_code",
                client_id: clientId,
                code: code,
                redirect_uri: redirectUri,
                code_verifier: verifier
            }).toString()
        });

        if (!response.ok) {
            throw new Error(
                "Token request failed with HTTP " + response.status
            );
        }

        const tokenData = await response.json();

        if (!tokenData.access_token) {
            throw new Error("Keycloak did not return an access token.");
        }

        // Test purpose only: do not log tokens in production.
        console.log("Keycloak access token:", tokenData.access_token);

        sessionStorage.removeItem("oauth_state");
        sessionStorage.removeItem("code_verifier");

        // Remove the authorization code from the address bar.
        window.history.replaceState(
            {},
            document.title,
            window.location.pathname
        );

        return tokenData.access_token;
    }

    // Initialize Teams.
    if (!window.microsoftTeams || !window.microsoftTeams.app) {
        showView(browserView);
        return;
    }

    try {
        await microsoftTeams.app.initialize();

        const context = await microsoftTeams.app.getContext();

        console.log("Teams context:", context);

        // Configuration view: collect and save the content URL.
        if (context.page?.frameContext === "settings") {
            showView(configureView);

            microsoftTeams.pages.config.setValidityState(false);

            contentUrlInput.addEventListener("input", () => {
                let valid = false;

                try {
                    const url = new URL(contentUrlInput.value.trim());
                    valid = url.protocol === "https:";
                } catch (_) {
                    valid = false;
                }

                microsoftTeams.pages.config.setValidityState(valid);
                configError.textContent = valid
                    ? ""
                    : "Enter a valid HTTPS URL.";
            });

            microsoftTeams.pages.config.registerOnSaveHandler(
                async saveEvent => {
                    try {
                        const url = new URL(contentUrlInput.value.trim());

                        if (url.protocol !== "https:") {
                            throw new Error("Enter a valid HTTPS URL.");
                        }

                        await microsoftTeams.pages.config.setConfig({
                            entityId: crypto.randomUUID(),
                            contentUrl: url.href,
                            websiteUrl: url.href,
                            suggestedDisplayName: "Custom Website"
                        });

                        saveEvent.notifySuccess();
                    } catch (error) {
                        configError.textContent = error.message;
                        saveEvent.notifyFailure(error.message);
                    }
                }
            );

            return;
        }

        // Normal tab: authenticate before displaying the configured page.
        showView(contentView);
        contentFrame.style.display = "none";

        const configuredUrl = getConfiguredContentUrl(context);

        if (!configuredUrl) {
            throw new Error(
                "Configured content URL is missing. Connect your saved tab URL to this page."
            );
        }

        // Validate the URL before rendering it.
        const parsedUrl = new URL(configuredUrl);

        if (parsedUrl.protocol !== "https:") {
            throw new Error("Only HTTPS content URLs are allowed.");
        }

        setAuthStatus("Authenticating...");
        authMessage.textContent =
            "The configured page will load after authentication succeeds.";

        const token = await authenticateWithKeycloak();

        // A null token means browser navigation to Keycloak has started.
        if (!token) {
            return;
        }

        setAuthStatus("Authentication successful.", true);
        authMessage.textContent = "Loading the configured page...";

        // Render only after successful authentication.
        contentFrame.src = parsedUrl.href;
        contentFrame.style.display = "block";
        authMessage.textContent = "The configured page has been loaded.";

    } catch (error) {
        console.error("Teams tab or authentication failed:", error);

        showView(contentView);
        contentFrame.style.display = "none";

        setAuthStatus("Authentication failed.");
        authMessage.textContent =
            error.message || "Unable to authenticate. The page was not loaded.";
    }
})();
</script>
</body>
</html>
```
