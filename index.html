<!DOCTYPE html>
<html>
<head>
    <script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js"></script>
    <script>
        window.onload = function () {
            // Initialize Teams SDK
            microsoftTeams.app.initialize().then(() => {

                const urlInput = document.getElementById("urlInput");
                const saveButton = document.getElementById("saveButton");

                // Enable the Save button only when input is not empty
                urlInput.addEventListener("input", () => {
                    const isValid = urlInput.value.trim() !== "";
                    microsoftTeams.pages.config.setValidityState(isValid);
                });

                // Register the save handler
                microsoftTeams.pages.config.registerOnSaveHandler((saveEvent) => {
                    const userUrl = urlInput.value.trim();
                    if (!userUrl) {
                        alert("Please enter a valid URL.");
                        saveEvent.notifyFailure();
                        return;
                    }

                    microsoftTeams.pages.config.setConfig({
                        entityId: "helloWorldTab",
                        contentUrl: `${userUrl}/login`,
                        websiteUrl: `${userUrl}/login`,
                        suggestedDisplayName: "HITL Dashboard"
                    }).then(() => {
                        saveEvent.notifySuccess();
                    }).catch((err) => {
                        console.error("Failed to set config", err);
                        saveEvent.notifyFailure(err);
                    });
                });

            }).catch((err) => {
                console.error("Teams SDK failed to initialize", err);
            });
        };
    </script>
</head>
<body>
    <h3>Configuration Page</h3>
    <p>Enter the base URL for your tab:</p>
    <input type="text" id="urlInput" placeholder="https://yourdomain.com" style="width: 300px;" />
    <p>The Save button will be enabled when a URL is entered.</p>
</body>
</html>
