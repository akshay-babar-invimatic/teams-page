<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Agent Summary</title>

    <!-- Polyfill: browsers don't have Node's `global`; some libs expect it -->
    <script>
        (function (g) {
            if (typeof g.global === 'undefined') g.global = g;
        })(typeof window !== 'undefined' ? window : self);
    </script>

    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://res.cdn.office.net/teams-js/2.45.0/js/MicrosoftTeams.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #ffffff;
            color: #111827;
        }

        .container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            text-align: center;
            padding: 24px 28px;
            width: 80%;
        }

        h4 {
            margin: 0 0 6px;
            font-size: 18px;
            font-weight: 600;
        }

        p {
            margin: 0 0 20px;
            font-size: 13px;
            color: #6b7280;
        }

        pre {
            text-align: left;
            background: #f5f5f5;
            border: 1px solid #ddd;
            padding: 12px;
            max-height: 350px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>

    <script>
        window.onload = function () {

            // Check if we're in a Teams iframe before attempting initialization
            if (window.parent === window) {
                console.log("Not running in Teams iframe - skipping Teams initialization");
                return;
            }

            if (window.microsoftTeams && window.microsoftTeams.app) {
                console.log("Hello");

                microsoftTeams.app.initialize().then(() => {

                    console.log("Teams SDK initialized");

                    microsoftTeams.app.getContext().then((context) => {

                        console.log("Full Teams Context:", context);
                        console.log("User Info:", context.user);
                        console.log("User JSON:", JSON.stringify(context.user, null, 2));
                        console.log("Frame Context:", context.page?.frameContext);

                        document.getElementById("context").textContent =
                            JSON.stringify(context, null, 2);

                        if (context.page && context.page.frameContext === "settings" && microsoftTeams.pages && microsoftTeams.pages.config) {

                            console.log("Registering Save Handler");

                            microsoftTeams.pages.config.setValidityState(true);

                            microsoftTeams.pages.config.registerOnSaveHandler((saveEvent) => {

                                console.log("Save button clicked");

                                // Replace with your GitHub Pages URL
                                var baseUrl = "https://akshay-babar-invimatic.github.io/teams-page/".replace(/\/$/, "");

                                console.log("Base URL:", baseUrl);

                                microsoftTeams.pages.config.setConfig({
                                    entityId: "agentSummaryTab",
                                    contentUrl: baseUrl,
                                    websiteUrl: baseUrl + "/",
                                    suggestedDisplayName: "Agent Homepage"
                                }).then(() => {

                                    console.log("setConfig SUCCESS");
                                    saveEvent.notifySuccess();

                                }).catch((err) => {

                                    console.error("setConfig FAILED:", err);
                                    saveEvent.notifyFailure(err?.message || JSON.stringify(err));

                                });

                            });

                        } else {

                            console.log("Skipping config code in content context");

                        }

                    }).catch((err) => {

                        console.log("Could not get Teams context:", err);

                    });

                }).catch((err) => {

                    const errorMsg = err && err.message ? err.message.toLowerCase() : String(err).toLowerCase();

                    if (errorMsg.includes("no parent window") || errorMsg.includes("initialization failed") || errorMsg.includes("parent window")) {

                        console.log("Not running in Microsoft Teams environment - this is normal for local development");

                    } else {

                        console.error("Error initializing Teams SDK:", err);

                    }

                });

            }
        };
    </script>

</head>

<body>

<div class="container">
    <div class="card">
        <h4>Agent Summary</h4>
        <p>Teams Tab Configuration Test</p>

        <pre id="context">
Waiting for Teams context...
        </pre>
    </div>
</div>

</body>
</html>
