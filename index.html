<!DOCTYPE html>
<html>
<head>
    <script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js"></script>
    <script>
        // Wait until the page is fully loaded
        window.onload = function () {
            console.log("Page loaded"); // log when page loads

            // 1. Initialize the Teams SDK
            microsoftTeams.app.initialize().then(() => {
                console.log("Teams SDK initialized successfully"); // log after initialization
                
                // 2. Enable the Save button
                microsoftTeams.pages.config.setValidityState(true);
                console.log("Save button enabled"); // log when save button enabled

                // 3. Register the save handler
                microsoftTeams.pages.config.registerOnSaveHandler((saveEvent) => {
                    console.log("Save button clicked"); // log when save clicked

                    // Get URL dynamically from the input field
                    const userUrl = document.getElementById("tabUrl").value || "https://sandboxqa.concept.theloops.ai/login";
                    console.log("URL entered by user:", userUrl); // log user URL

                    microsoftTeams.pages.config.setConfig({
                        entityId: "helloWorldTab",
                        contentUrl: userUrl,
                        websiteUrl: userUrl,
                        suggestedDisplayName: "HITL Dashboard"
                    }).then(() => {
                        console.log("Teams config set successfully"); // log success
                        saveEvent.notifySuccess();
                    }).catch((err) => {
                        console.error("Failed to set config", err); // log error
                        saveEvent.notifyFailure(err);
                    });
                });

            }).catch((err) => {
                console.error("Teams SDK failed to initialize", err); // log initialization error
            });
        };
    </script>
</head>
<body>
    <h3>Configuration Page Loaded Test</h3>
    <p>If the Save button is active, the SDK connected successfully.</p>

    <!-- Added input field for dynamic URL -->
    <label for="tabUrl">Enter Tab URL:</label>
    <input type="text" id="tabUrl" placeholder="https://yoururl.com" style="width: 300px;">
</body>
</html>
