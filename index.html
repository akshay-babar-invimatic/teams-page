<!DOCTYPE html>
<html>
<head>
    <script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js"></script>
    <script>
        // Wait until the page is fully loaded 
        window.onload = function () {
            // 1. Initialize the Teams SDK
            microsoftTeams.app.initialize().then(() => {

                const urlInput = document.getElementById("urlInput");

                // Log the user input whenever it changes
                urlInput.addEventListener("input", () => {
                    const userUrl = urlInput.value.trim();
                    console.log("[DEBUG] User entered URL:", userUrl);
                });

                // 3. Register the save handler
                microsoftTeams.pages.config.registerOnSaveHandler((saveEvent) => {
                    // Always use hardcoded URL for the tab
                    const hardcodedUrl = "https://sandboxqa.concept.theloops.ai/login";

                    microsoftTeams.pages.config.setConfig({
                        entityId: "helloWorldTab",
                        contentUrl: hardcodedUrl,
                        websiteUrl: hardcodedUrl,
                        suggestedDisplayName: "HITL Dashboard"
                    }).then(() => {
                        console.log("[DEBUG] Tab configured with hardcoded URL:", hardcodedUrl);
                        saveEvent.notifySuccess();
                    }).catch((err) => {
                        console.error("Failed to set config", err);
                        saveEvent.notifyFailure(err);
                    });
                });

            }).catch((err) => {
                console.error("Teams SDK failed to initialize", err);
            });
        };
    </script>
</head>
<body>
    <h3>Configuration Page Loaded</h3>
    <p>Enter a URL for debugging (this will only be logged, not used in the tab):</p>
    <input type="text" id="urlInput" placeholder="https://example.com" style="width: 300px;" />
    <p>If the Save button is active, the SDK connected successfully.</p>
</body>
</html>
