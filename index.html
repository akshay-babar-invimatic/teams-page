<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Agent Summary - 1</title>

    <script src="https://res.cdn.office.net/teams-js/2.45.0/js/MicrosoftTeams.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #ffffff;
            color: #111827;
        }

        .container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            text-align: center;
            padding: 24px 28px;
        }

        h4 {
            margin: 0 0 6px;
            font-size: 15px;
            font-weight: 600;
        }

        p {
            margin: 0;
            font-size: 12px;
            color: #6b7280;
        }

        /* Scrollable JSON popup */
        #jsonPopup {
            display: none;
            position: fixed;
            top: 10%;
            left: 10%;
            width: 80%;
            height: 80%;
            background: #fff;
            border: 1px solid #000;
            z-index: 1000;
            padding: 10px;
            overflow: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        #jsonPopup button {
            margin-bottom: 10px;
            padding: 5px 10px;
            cursor: pointer;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>

    <script>
        window.onload = function () {
            microsoftTeams.app.initialize().then(() => {

                microsoftTeams.app.getContext().then((context) => {
                    console.log("Full Teams Context:", context);

                    // Show JSON in scrollable popup
                    const popup = document.getElementById('jsonPopup');
                    const content = document.getElementById('jsonContent');
                    content.textContent = JSON.stringify(context, null, 2);
                    popup.style.display = 'block';
                });

                microsoftTeams.pages.config.setValidityState(true);

                microsoftTeams.pages.config.registerOnSaveHandler((saveEvent) => {
                    microsoftTeams.pages.config.setConfig({
                        entityId: "agentSummaryTab",
                        contentUrl: "https://sandboxqa.concept.theloops.ai/login",
                        websiteUrl: "https://sandboxqa.concept.theloops.ai/login",
                        suggestedDisplayName: "Agent Summary"
                    }).then(() => {
                        saveEvent.notifySuccess();
                    }).catch((err) => {
                        saveEvent.notifyFailure(err);
                    });
                });
            });
        };
    </script>
</head>

<body>
    <div class="container">
        <div class="card">
            <h4>Agent Summary</h4>
            <p>Preparing tab configuration</p>
        </div>
    </div>

    <!-- Scrollable JSON popup -->
    <div id="jsonPopup">
        <button onclick="document.getElementById('jsonPopup').style.display='none'">Close</button>
        <pre id="jsonContent"></pre>
    </div>
</body>
</html>
