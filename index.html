<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Agent Summary</title>
    <!-- Polyfill: browsers don't have Node's `global`; some libs expect it -->
    <script>(function(g){if(typeof g.global==='undefined')g.global=g;})(typeof window!=='undefined'?window:self);</script>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <script src="https://res.cdn.office.net/teams-js/2.45.0/js/MicrosoftTeams.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #ffffff;
            color: #111827;
        }

        .container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            text-align: center;
            padding: 24px 28px;
        }

        h4 {
            margin: 0 0 6px;
            font-size: 15px;
            font-weight: 600;
        }

        p {
            margin: 0;
            font-size: 12px;
            color: #6b7280;
        }
    </style>

    <script>
        window.onload = function () {
            // Check if we're in a Teams iframe before attempting initialization
            if (window.parent === window) {
                console.log('Not running in Teams iframe - skipping Teams initialization');
                return;
            }

            if (window.microsoftTeams && window.microsoftTeams.app) {
                microsoftTeams.app.initialize().then(() => {

                    microsoftTeams.app.getContext().then((context) => {
                        console.log("Full Teams Context:", context);
                        console.log("User Info:", context.user);
                        console.log("User JSON:", JSON.stringify(context.user, null, 2));
                    }).catch((err) => {
                        console.log('Could not get Teams context - running outside Teams environment');
                    });

                    if (microsoftTeams.pages && microsoftTeams.pages.config) {
                        microsoftTeams.pages.config.setValidityState(true);

                        microsoftTeams.pages.config.registerOnSaveHandler((saveEvent) => {
                            // Concept base URL
                            var baseUrl = 'https://agenthomepage.concept.theloops.ai'.replace(/\/$/, '');
                            microsoftTeams.pages.config.setConfig({
                                entityId: "agentSummaryTab",
                                contentUrl: baseUrl,
                                websiteUrl: baseUrl + "/",
                                suggestedDisplayName: "Agent Homepage"
                            }).then(() => {
                                saveEvent.notifySuccess();
                            }).catch((err) => {
                                saveEvent.notifyFailure(err);
                            });
                        });
                    }
                }).catch((err) => {
                    // Handle initialization errors gracefully
                    const errorMsg = err && err.message ? err.message.toLowerCase() : String(err).toLowerCase();
                    if (errorMsg.includes('no parent window') ||
                        errorMsg.includes('initialization failed') ||
                        errorMsg.includes('parent window')) {
                        console.log('Not running in Microsoft Teams environment - this is normal for local development');
                    } else {
                        console.error('Error initializing Teams SDK:', err);
                    }
                });
            }
        };
    </script>
  </head>
  <body>
    <div id="root">Test</div>
  </body>
</html>
