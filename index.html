<!DOCTYPE html>
<html>
<head>
    <script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js"></script>
    <script>
        // Helper function to get query params
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        window.onload = function () {
            // 1. Initialize the Teams SDK
            microsoftTeams.app.initialize().then(() => {
                
                // 2. Enable the Save button
                microsoftTeams.pages.config.setValidityState(true);

                // 3. Determine URLs dynamically
                const baseUrl = getQueryParam("baseUrl") || "https://sandboxqa.concept.theloops.ai"; 
                const contentUrl = `${baseUrl}/login`;
                const websiteUrl = `${baseUrl}/login`;

                // 4. Register the save handler
                microsoftTeams.pages.config.registerOnSaveHandler((saveEvent) => {
                    microsoftTeams.pages.config.setConfig({
                        entityId: "helloWorldTab",
                        contentUrl: contentUrl,
                        websiteUrl: websiteUrl,
                        suggestedDisplayName: "HITL Dashboard"
                    }).then(() => {
                        // Notify Teams that the save is complete
                        saveEvent.notifySuccess();
                    }).catch((err) => {
                        console.error("Failed to set config", err);
                        saveEvent.notifyFailure(err);
                    });
                });

            }).catch((err) => {
                console.error("Teams SDK failed to initialize", err);
            });
        };
    </script>
</head>
<body>
    <h3>Configuration Page Loaded</h3>
    <p>If the Save button is active, the SDK connected successfully.</p>
</body>
</html>
