<!DOCTYPE html>
<html>
<head>
    <script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js"></script>
    <script>
        window.onload = function () {
            console.log("[DEBUG] Page loaded, initializing Teams SDK...");

            // Initialize Teams SDK
            microsoftTeams.app.initialize().then(() => {
                console.log("[DEBUG] Teams SDK initialized successfully");

                const urlInput = document.getElementById("urlInput");

                // Enable the Save button when input is not empty
                urlInput.addEventListener("input", () => {
                    const value = urlInput.value.trim();
                    const isNotEmpty = value !== "";
                    console.log(`[DEBUG] Input changed: '${value}', Save button enabled: ${isNotEmpty}`);
                    microsoftTeams.pages.config.setValidityState(isNotEmpty);
                });

                // Register the save handler
                microsoftTeams.pages.config.registerOnSaveHandler((saveEvent) => {
                    const userUrl = urlInput.value.trim();
                    console.log(`[DEBUG] Save button clicked, user entered URL: '${userUrl}'`);

                    if (!userUrl) {
                        console.warn("[DEBUG] Empty URL entered, cannot set config");
                        saveEvent.notifyFailure();
                        return;
                    }

                    // Set the tab configuration using the exact URL entered
                    microsoftTeams.pages.config.setConfig({
                        entityId: "helloWorldTab",
                        contentUrl: userUrl,
                        websiteUrl: userUrl,
                        suggestedDisplayName: "HITL Dashboard"
                    }).then(() => {
                        console.log(`[DEBUG] Tab configuration set successfully with URL: '${userUrl}'`);
                        saveEvent.notifySuccess();
                    }).catch((err) => {
                        console.error("[DEBUG] Failed to set tab configuration", err);
                        saveEvent.notifyFailure(err);
                    });
                });

            }).catch((err) => {
                console.error("[DEBUG] Teams SDK failed to initialize", err);
            });
        };
    </script>
</head>
<body>
    <h3>Configuration Page Test</h3>
    <p>Enter the full URL for your tab (including HTTPS):</p>
    <input type="text" id="urlInput" placeholder="https://example.com" style="width: 300px;" />
    <p>The Save button will be enabled once you enter the URL.</p>
</body>
</html>
