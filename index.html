<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Agent Summary</title>

    <script src="https://res.cdn.office.net/teams-js/2.45.0/js/MicrosoftTeams.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #ffffff;
            color: #111827;
        }

        .container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            text-align: center;
            padding: 24px 28px;
        }

        h4 {
            margin: 0 0 6px;
            font-size: 15px;
            font-weight: 600;
        }

        p {
            margin: 0;
            font-size: 12px;
            color: #6b7280;
        }
    </style>

    <script>
        window.onload = function () {
            microsoftTeams.app.initialize().then(() => {
                
                microsoftTeams.app.getContext().then((context) => {
                console.log("Full Teams Context:", context);
                console.log("User Info:", context.user);
                console.log("User JSON:", JSON.stringify(context.user, null, 2));
            });
                
                microsoftTeams.pages.config.setValidityState(true);

                microsoftTeams.pages.config.registerOnSaveHandler((saveEvent) => {
                    microsoftTeams.pages.config.setConfig({
                        entityId: "agentSummaryTab",
                        contentUrl: "https://sandboxqa.concept.theloops.ai/login",
                        websiteUrl: "https://sandboxqa.concept.theloops.ai/login",
                        suggestedDisplayName: "Agent Summary"
                    }).then(() => {
                        saveEvent.notifySuccess();
                    }).catch((err) => {
                        saveEvent.notifyFailure(err);
                    });
                });
            });
        };
    </script>
</head>

<body>
    <div class="container">
        <div class="card">
            <h4>Agent Summary</h4>
            <p>Preparing tab configuration</p>
        </div>
    </div>
</body>
</html>
