<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Teams Tab Configuration Test</title>

    <!-- Polyfill -->
    <script>
        (function(g) {
            if (typeof g.global === 'undefined') g.global = g;
        })(typeof window !== 'undefined' ? window : self);
    </script>

    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://res.cdn.office.net/teams-js/2.45.0/js/MicrosoftTeams.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #ffffff;
        }

        .card {
            text-align: center;
            padding: 24px;
        }

        h3 {
            margin-bottom: 8px;
        }

        p {
            color: #666;
        }
    </style>

    <script>
        window.onload = function () {

            console.log("Page Loaded");

            // Skip if opened directly in browser
            if (window.parent === window) {
                console.log("Not inside Teams iframe.");
                return;
            }

            if (window.microsoftTeams && window.microsoftTeams.app) {

                microsoftTeams.app.initialize()
                    .then(() => {

                        console.log("Teams SDK Initialized");

                        return microsoftTeams.app.getContext();

                    })
                    .then((context) => {

                        console.log("Teams Context:", context);
                        console.log("Frame Context:", context.page?.frameContext);

                        if (
                            context.page &&
                            context.page.frameContext === "settings" &&
                            microsoftTeams.pages &&
                            microsoftTeams.pages.config
                        ) {

                            console.log("Registering Save Handler");

                            microsoftTeams.pages.config.setValidityState(true);

                            microsoftTeams.pages.config.registerOnSaveHandler((saveEvent) => {

                                console.log("Save button clicked");

                                // Replace with your hosted URL
                                var baseUrl = "https://agenthomepage.concept.theloops.ai";

                                microsoftTeams.pages.config.setConfig({
                                    entityId: "sampleTab",
                                    suggestedDisplayName: "Sample Tab",
                                    contentUrl: baseUrl,
                                    websiteUrl: baseUrl + "/"
                                })
                                .then(() => {
                                    console.log("setConfig SUCCESS");
                                    saveEvent.notifySuccess();
                                })
                                .catch((err) => {
                                    console.error("setConfig FAILED", err);
                                    saveEvent.notifyFailure(err.message || JSON.stringify(err));
                                });

                            });

                        } else {

                            console.log("Content context. Skipping configuration.");

                        }

                    })
                    .catch((err) => {
                        console.error("Teams SDK Error:", err);
                    });

            } else {

                console.error("Teams SDK not found.");

            }

        };
    </script>

</head>

<body>

<div class="card">
    <h3>Teams Tab Configuration Test</h3>
    <p>Open the browser console to view logs.</p>
</div>

</body>
</html>
