<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Configure Teams Tab</title>

    <script src="https://res.cdn.office.net/teams-js/2.45.0/js/MicrosoftTeams.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #ffffff;
            color: #111827;
        }

        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 80%;
            max-width: 600px;
            padding: 24px;
        }

        h2 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        p {
            color: #6b7280;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            border: 1px solid #9ca3af;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            margin-top: 16px;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            background: #5b5fc7;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background: #4649a8;
        }

        .error {
            color: #b91c1c;
        }

        .hidden {
            display: none;
        }

        pre {
            padding: 12px;
            background: #f5f5f5;
            border: 1px solid #ddd;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="card">

        <!-- Teams tab configuration view -->
        <section id="configureView" class="hidden">
            <h2>Configure Website Tab</h2>
            <p>Enter the Content URL you want to display inside this Teams tab.</p>

            <form id="configForm">
                <label for="contentUrl">Content URL</label>

                <input
                    id="contentUrl"
                    type="text"
                    placeholder="Enter Content URL"
                    autocomplete="url"
                    required
                />

                <p id="errorMessage" class="error"></p>

            </form>
        </section>

        <!-- Normal Teams tab view -->
        <section id="contentView" class="hidden">
            <h2>Agent Summary</h2>
            <p>Your Teams tab has been configured.</p>
            <pre id="context">Loading Teams context...</pre>
        </section>

        <!-- Opened outside Teams -->
        <section id="browserView" class="hidden">
            <h2>Configure Teams Tab</h2>
            <p>Open this page inside Microsoft Teams to configure the tab.</p>
        </section>

    </div>
</div>

<script>
(async function () {
    const configureView = document.getElementById("configureView");
    const contentView = document.getElementById("contentView");
    const browserView = document.getElementById("browserView");

    const contentUrlInput = document.getElementById("contentUrl");
    const errorMessage = document.getElementById("errorMessage");
    const contextOutput = document.getElementById("context");

    function showView(view) {
        configureView.classList.add("hidden");
        contentView.classList.add("hidden");
        browserView.classList.add("hidden");

        view.classList.remove("hidden");
    }

    // Check whether the Teams SDK is available.
    if (!window.microsoftTeams || !window.microsoftTeams.app) {
        showView(browserView);
        return;
    }

    try {
        // Initialize Teams SDK.
        await microsoftTeams.app.initialize();

        // Get the current Teams context.
        const context = await microsoftTeams.app.getContext();

        console.log("Teams context:", context);

        contextOutput.textContent = JSON.stringify(context, null, 2);

        // Configuration mode: Teams is adding/configuring the tab.
        if (context.page?.frameContext === "settings") {
            showView(configureView);

            // Enable Save only when a URL is entered.
            microsoftTeams.pages.config.setValidityState(false);

            contentUrlInput.addEventListener("input", () => {
                const isValid = contentUrlInput.value.trim().length > 0;

                microsoftTeams.pages.config.setValidityState(isValid);
                errorMessage.textContent = "";
            });

            // Handle the Save action from Teams.
            microsoftTeams.pages.config.registerOnSaveHandler(
                async (saveEvent) => {
                    try {
                        const contentUrl = contentUrlInput.value.trim();

                        if (!contentUrl) {
                            throw new Error("Please enter a Content URL.");
                        }

                        await microsoftTeams.pages.config.setConfig({
                            entityId: crypto.randomUUID(),
                            contentUrl: contentUrl,
                            websiteUrl: contentUrl,
                            suggestedDisplayName: "Custom Website"
                        });

                        console.log("Teams tab configuration saved:", contentUrl);

                        saveEvent.notifySuccess();
                    } catch (error) {
                        console.error("Failed to save tab configuration:", error);

                        errorMessage.textContent =
                            error.message || "Unable to save the configuration.";

                        saveEvent.notifyFailure(errorMessage.textContent);
                    }
                }
            );


        } else {
            // Normal tab content after Teams has saved the configuration.
            showView(contentView);

            console.log("Teams tab content context:", context);
        }

    } catch (error) {
        console.error("Teams initialization failed:", error);
        showView(browserView);
    }
})();
</script>
</body>
</html>
